[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "er1-verify"
version = "1.0.1"
description = "ER1 — reference offline verifier for Epistemic Receipts (constraint-state receipts)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Mars Ausili", email = "mars@cruxia.ai" }]
keywords = ["agent", "receipt", "attestation", "constraint", "verification", "ed25519", "offline"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=41"]

[project.urls]
Homepage = "https://github.com/Cruxia-Labs/er1-spec"
Conformance = "https://github.com/Cruxia-Labs/er1-spec/blob/main/CONFORMANCE.md"
Scope = "https://github.com/Cruxia-Labs/er1-spec/blob/main/SCOPE_OF_CERTIFICATION.md"

[project.scripts]
er1-verify = "er1_verify:main"

[tool.setuptools]
py-modules = ["er1_verify"]
