name: CI

# Continuously prove the core claim: the two reference verifiers reproduce golden_vectors.json
# byte-for-byte, and a one-byte tamper is rejected — in Python AND JavaScript, on every push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install cryptography pytest
      - name: Conformance — Python + cross-language suites (`python -m` so er1_verify imports)
        run: python -m pytest test_conformance.py test_cross_language.py tests -q
      - name: Explicit JS check — node reproduces the vectors (fails loudly if node is unusable)
        run: node er1_verify.mjs golden_vectors.json
      - name: Browser verifier — WebCrypto-only module under Node's globalThis.crypto (golden vectors + tamper pairs)
        run: node tests/test_browser_verifier.mjs
      # The adversarial corpus, run against each JavaScript build on its own. The pytest step
      # above already gates all three implementations and their agreement
      # (tests/test_conformance_corpus.py); these two steps make a corpus failure legible as
      # itself in the log, and keep the JS side gated even if Python collection ever changes.
      - name: Adversarial corpus — Node reference verifier refuses every case
        run: node tests/run_conformance_cases.mjs
      - name: Adversarial corpus — browser build refuses every case
        run: node tests/run_conformance_cases.mjs --browser
